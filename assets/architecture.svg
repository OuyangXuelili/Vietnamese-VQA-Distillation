<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Vietnamese VQA teacher student architecture</title>
  <desc id="desc">Vietnamese VQA dataset fine-tunes a 7B teacher, which distills knowledge into a 2B student used by the web application.</desc>
  <defs>
    <linearGradient id="teacher" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="student" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#f8fafc"/>
  <text x="600" y="39" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Teacher–Student Knowledge Distillation Pipeline</text>

  <g font-family="Segoe UI, Arial" filter="url(#s)">
    <g transform="translate(45 103)">
      <rect width="190" height="130" rx="20" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="44" cy="42" r="20" fill="#f59e0b" opacity=".16"/>
      <path d="M33 48h22M33 40h22M38 32h12" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      <text x="95" y="46" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">VLSP2023 VQA</text>
      <text x="95" y="79" text-anchor="middle" fill="#64748b" font-size="14">Ảnh · Câu hỏi</text>
      <text x="95" y="101" text-anchor="middle" fill="#64748b" font-size="14">Câu trả lời tiếng Việt</text>
    </g>

    <g transform="translate(328 82)">
      <rect width="220" height="172" rx="22" fill="url(#teacher)"/>
      <text x="110" y="45" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700" letter-spacing="1">LORA FINE-TUNING</text>
      <text x="110" y="88" text-anchor="middle" fill="#fff" font-size="27" font-weight="750">Teacher 7B</text>
      <text x="110" y="119" text-anchor="middle" fill="#dbeafe" font-size="14">Qwen2-VL-7B</text>
      <rect x="55" y="139" width="110" height="23" rx="12" fill="#fff" opacity=".14"/>
      <text x="110" y="155" text-anchor="middle" fill="#fff" font-size="12">High capacity</text>
    </g>

    <g transform="translate(652 82)">
      <rect width="220" height="172" rx="22" fill="url(#student)"/>
      <text x="110" y="45" text-anchor="middle" fill="#a5f3fc" font-size="13" font-weight="700" letter-spacing="1">DISTILLED MODEL</text>
      <text x="110" y="88" text-anchor="middle" fill="#fff" font-size="27" font-weight="750">Student 2B</text>
      <text x="110" y="119" text-anchor="middle" fill="#cffafe" font-size="14">Qwen2-VL-2B</text>
      <rect x="48" y="139" width="124" height="23" rx="12" fill="#fff" opacity=".14"/>
      <text x="110" y="155" text-anchor="middle" fill="#fff" font-size="12">Deployment-ready</text>
    </g>

    <g transform="translate(965 103)">
      <rect width="190" height="130" rx="20" fill="#fff" stroke="#cbd5e1"/>
      <rect x="36" y="28" width="118" height="69" rx="9" fill="#ecfeff" stroke="#67e8f9"/>
      <circle cx="60" cy="52" r="11" fill="#22d3ee" opacity=".55"/>
      <path d="m47 82 23-19 15 12 18-23 35 30" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="119" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="700">Gradio Demo</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M247 168h66"/>
    <path d="M563 168h72"/>
    <path d="M887 168h62"/>
  </g>
  <text x="600" y="144" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial" font-size="12" font-weight="700">KNOWLEDGE</text>
  <text x="600" y="190" text-anchor="middle" fill="#475569" font-family="Segoe UI, Arial" font-size="12" font-weight="700">DISTILLATION</text>
  <text x="600" y="299" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="13">Image + Vietnamese question → grounded Vietnamese answer</text>
</svg>
