  <text x="66" y="214" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="750">Vietnamese VQA Distillation</text>
  <text x="67" y="253" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Visual Question Answering · Qwen2-VL · Knowledge Distillation</text>
