    <path d="M15 20h28v20H15z" fill="none" stroke="#fff" stroke-width="3" rx="4"/>
    <circle cx="24" cy="28" r="4" fill="#fff"/>
    <path d="m18 37 8-7 7 6 5-4 5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
