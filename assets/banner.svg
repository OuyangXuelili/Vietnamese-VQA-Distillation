    <path d="M117 17h42" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m154 12 7 5-7 5" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="174" width="106" height="34" rx="17" fill="#fff" opacity=".09" stroke="#fff" stroke-opacity=".18"/>
    <text x="227" y="22" text-anchor="middle" fill="#e2e8f0">Student 2B</text>
