# Data Configuration for Vi-VQA
# Dataset source: Ouyangxuelili/vlsp2023-vqa-dataset (Hugging Face Hub)

# HuggingFace Dataset Settings
huggingface:
  repo_id: "Ouyangxuelili/vlsp2023-vqa-dataset"
  cache_dir: "./data/cache"
  streaming: false
  use_auth_token: false

# Local data paths (if downloaded locally)
local:
  train_images: "./data/raw/train"
  dev_images: "./data/raw/dev"
  
  train_json: "./data/raw/vlsp2023_train_data.json"
  dev_json: "./data/raw/vlsp2023_dev_data.json"

# Dataset splits published on Hugging Face
splits:
  train: "train"
  eval: "dev"

# Counts from the published annotation files
statistics:
  train_samples: 30833
  dev_samples: 3545
  total_samples: 34378
  train_images: 9129
  dev_referenced_images: 1070

# Data processing
processing:
  max_samples: null  # Set to int to limit samples (e.g., 1000)
  shuffle: true
  shuffle_seed: 42
  
# VQA specific
vqa:
  max_question_length: 512
  max_answer_length: 100
  tokenizer_max_length: 1024
  
# Image handling
image:
  keep_aspect_ratio: true
  # Image size will be determined by vision processor (256*28*28 to 512*512)
  
# Data loading
dataloader:
  num_workers: 4
  batch_size: 32
  pin_memory: true
  persistent_workers: false

