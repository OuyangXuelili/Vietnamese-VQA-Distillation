[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-vqa-explanation"
version = "0.1.0"
description = "Reproducible SFT and DPO experiments for Vietnamese explainable VQA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.49",
  "datasets>=3.0",
  "accelerate>=1.2",
  "peft>=0.14",
  "trl>=0.15",
  "bitsandbytes>=0.45; platform_system != 'Windows'",
]
eval = [
  "pandas>=2.2",
  "scipy>=1.13",
  "rouge-score>=0.1.2",
  "matplotlib>=3.9",
]
demo = ["gradio>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

